[build-system]
requires = [
    # >=77 for the PEP 639 SPDX `license` string below.
    "setuptools>=77",
    "versioneer[toml]==0.29",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyiron_workflow_vasp"
dynamic = ["version"]
description = "A VASP workflow integration package for pyiron"
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "pyiron Team", email = "pyiron@mpie.de" }
]
keywords = ["pyiron", "vasp", "workflow", "dft", "materials-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Strict ==-pins match .ci_support/environment.yml. The release workflow
    # (.github/workflows/release.yml) rewrites these to >=lower,<upper ranges
    # before publishing: floors come from .ci_support/lower-bound.yml, caps
    # from .ci_support/upper-bound.yml (all 0.x deps, which would otherwise be
    # pinned exactly) or else the next minor version.
    "ase==3.29.0",
    "flowrep==0.6.7",
    "monty==2026.7.16",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pyiron_snippets==1.5.0",
    "pyiron-workflow==0.20.3",
    "pyiron-workflow-atomistics==0.2.2",
    "pymatgen==2026.9.24",
    "scipy==1.17.1",
    "vaspparser==0.0.12",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "nbformat",
    "nbclient",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
    "ruff>=0.5",
]
notebook = [
    "jupyter>=1.0.0",
    "notebook>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/pyiron/pyiron_workflow_vasp"
Documentation = "https://github.com/pyiron/pyiron_workflow_vasp"
Repository = "https://github.com/pyiron/pyiron_workflow_vasp.git"
"Bug Tracker" = "https://github.com/pyiron/pyiron_workflow_vasp/issues"

[tool.versioneer]
VCS = "git"
style = "pep440-pre"
versionfile_source = "pyiron_workflow_vasp/_version.py"
versionfile_build = "pyiron_workflow_vasp/_version.py"
parentdir_prefix = "pyiron_workflow_vasp-"
tag_prefix = "pyiron_workflow_vasp-"

[tool.setuptools.packages.find]
include = ["pyiron_workflow_vasp*"]

[tool.setuptools.package-data]
# vasp_resources/ has no __init__.py, so it is picked up as a namespace
# subpackage; its CSVs are read at runtime via Path(__file__) in vasp.py.
"pyiron_workflow_vasp" = ["vasp_resources/*.csv"]

[tool.ruff]
exclude = [
    "docs",
    "notebooks",
    "example_notebooks",
    "examples",
    "setup.py",
    "_version.py",
    "versioneer.py",
    ".github",
    # Legacy pre-VaspEngine helper code is held as-is; new VaspEngine
    # additions (engine.py, _run.py, tests/unit/) are held to the full rule set.
    "pyiron_workflow_vasp/vasp.py",
    "pyiron_workflow_vasp/generic.py",
    "pyiron_workflow_vasp/vasp_parser",
    "tests/conftest.py",
    "tests/test_smoke.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
(
  ^/docs
  | ^/example_notebooks
  | ^/examples
  | ^/\.github
  | _version\.py
  | versioneer\.py
  | ^/pyiron_workflow_vasp/vasp\.py$
  | ^/pyiron_workflow_vasp/generic\.py$
  | ^/pyiron_workflow_vasp/vasp_parser/
  | ^/tests/conftest\.py$
  | ^/tests/test_smoke\.py$
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=pyiron_workflow_vasp"
testpaths = [
    "tests",
]
# Only escalate SyntaxWarnings from this package: third-party modules (e.g.
# vaspparser's outcar.py) are compiled fresh in a new env and would otherwise
# turn into collection errors. Compile-time warnings carry the source *path*
# (minus .py) as their module, hence a path regex rather than a dotted name.
filterwarnings = ['error::SyntaxWarning:.*pyiron_workflow_vasp[/\\](vasp_parser[/\\])?\w+\Z']
markers = ["integration: requires a real VASP binary (set ASSYST_VASP_BINARY)"]
