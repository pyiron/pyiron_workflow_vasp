# This runs jobs which pyiron modules should run on pushes or PRs to main
name: Push-Pull

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pyiron:
    uses: pyiron/actions/.github/workflows/push-pull.yml@actions-4.0.8
    with:
      runner: 'ubuntu-22.04'
      # pandas wheels start at python 3.11, so the default 3.10 (alt2) leg is
      # excluded; alt3 (default 3.9) is repurposed for the newest supported
      # python. The main leg is 3.12 and alt1 defaults to 3.11.
      python-version-alt2: 'exclude'
      python-version-alt3: '3.14'
      runner-alt1: 'exclude'
      # The ligerzero-ai org does not define DEPENDABOT_WORKFLOW_TOKEN; the
      # commit-updated-env job's checkout step fails for lack of the secret.
      # Disable it here; flip back on after the org migration to pyiron/.
      do-commit-updated-env: false
      # No docs/conf.py in this repo yet
      do-build-docs: false
      # No tests/benchmark dir yet
      do-benchmark-tests: false
      # `coverage combine` needs multi-process runs; we only have a single
      # unittest invocation. Keep coveralls off until that's plumbed.
      do-coveralls: false
    secrets: inherit
