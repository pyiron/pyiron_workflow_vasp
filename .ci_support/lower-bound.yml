# Inclusive floors the release workflow writes into the published
# [project].dependencies. pyiron_workflow_atomistics is the binding floor for
# most of the stack: 0.2.0/0.2.1 pin pyiron_workflow==0.19.0 and
# flowrep<=0.6.2, and the engine API used here (CalcInputStatic/Minimize/MD,
# EngineOutput, testing.EngineConformanceTests) is unchanged since 0.2.0, so
# 0.2.2 is the first co-installable release. numpy/pandas/scipy/ase/pymatgen
# floors mirror what pyiron_workflow_atomistics 0.2.2 itself requires --
# anything lower could never be installed alongside it. The test suite passes
# (py3.11) on the lowest stack that actually resolves: pyiron_workflow 0.19.0,
# flowrep 0.6.0, vaspparser 0.0.9, pyiron_snippets 1.3.0, pymatgen 2024.8.8,
# monty 2024.7.30, numpy 1.26.4, pandas 2.0.3, ase 3.24.0, scipy 1.17.1.
# Names must be the conda names (cf. pypi_vs_conda_names.json); for pip-only
# packages use the underscore spelling so the lookup matches.
channels:
  - conda-forge

dependencies:
  - python =3.11
  - pip
  - ase =3.21.0
  - flowrep =0.6.0  # only fr.atomic / fr.workflow are used
  - monty =2024.7.30  # monty.io.zopen; first release meeting pymatgen 2024.8.8
  - numpy =1.22.0
  - pandas =1.3.0
  - pyiron_snippets =1.3.0
  - pyiron_workflow =0.19.0  # tests pass on 0.19.0, 0.19.2, 0.20.3
  - pymatgen =2024.8.8
  - scipy =1.17.1
  - vaspparser =0.0.9  # parse_vasp_output API identical 0.0.5 - 0.0.12
  - pip:
      - pyiron_workflow_atomistics==0.2.2
