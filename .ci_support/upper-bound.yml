# Exclusive caps for the release workflow. Every 0.x dependency needs one
# here, otherwise always-pin-unstable pins it to the exact patch version and
# the published wheel cannot be co-installed with its siblings.
channels:
  - conda-forge

dependencies:
  - flowrep =0.7.0
  # numpy/scipy: the suite passes on numpy 2.5.4 / scipy 1.18.1 (77 passed,
  # 3 skipped with those as overrides); the pins stay on 3.11-compatible
  # releases, so cap one minor above the newest version tested.
  - numpy =2.6.0
  - scipy =1.19.0
  - monty =2027.0.0  # calendar-versioned; the default minor cap would be one month
  - pymatgen =2027.0.0  # calendar-versioned, as above
  - pyiron_snippets =2.0.0
  - pyiron_workflow =0.21.0
  - vaspparser =0.1.0
  - pip:
      - pyiron_workflow_atomistics==0.3.0
